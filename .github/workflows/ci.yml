name: Offline verification

on:
  push:
    branches: [yuto, main]
  pull_request:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  offline:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: "3.9"}
          - {os: ubuntu-latest, python: "3.13"}
          - {os: macos-latest, python: "3.11"}
          - {os: windows-latest, python: "3.11"}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: atomgit_cli
          python-version: ${{ matrix.python }}
          auto-activate-base: false
      - name: Install locked development dependencies
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Verify the complete offline baseline
        run: |
          python tests/run_cli_baseline.py
          python -m compileall -q .
          python -m pip check
          git diff --check
