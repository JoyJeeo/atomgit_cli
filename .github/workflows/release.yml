name: Release AtomGit CLI

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable release version (X.Y.Z)"
        required: true
        type: string
      source_sha:
        description: "Exact yuto commit to release"
        required: true
        type: string

concurrency:
  group: atomgit-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release input
        shell: bash
        run: |
          [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${{ inputs.source_sha }}" =~ ^[0-9a-f]{40}$ ]]
      - name: Check out exact yuto source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Confirm source is on yuto
        run: git branch -r --contains "${{ inputs.source_sha }}" | grep -E 'origin/yuto$'
      - name: Build and checksum release assets
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel --sdist
          test "$(find dist -maxdepth 1 -name 'atomgit-${{ inputs.version }}-py3-none-any.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name 'atomgit-${{ inputs.version }}.tar.gz' | wc -l)" -eq 1
          python - "${{ inputs.version }}" <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          expected = sys.argv[1]
          wheel = next(Path("dist").glob("atomgit-*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              text = archive.read(metadata).decode("utf-8")
          assert f"Name: atomgit\n" in text and f"Version: {expected}\n" in text
          PY
          cp LICENSE dist/LICENSE
          (cd dist && sha256sum LICENSE atomgit-${{ inputs.version }}-py3-none-any.whl atomgit-${{ inputs.version }}.tar.gz) > dist/SHA256SUMS
      - name: Upload immutable preparation artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08
        with:
          name: atomgit-release-${{ inputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: release-approval
    permissions:
      contents: write
    steps:
      - name: Check out exact release notes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_sha }}
          sparse-checkout: |
            RELEASE_NOTES.md
            LICENSE
          sparse-checkout-cone-mode: false
      - name: Validate release notes identity
        run: |
          test -s RELEASE_NOTES.md
          grep -Fx "# AtomGit CLI ${{ inputs.version }}" RELEASE_NOTES.md
      - name: Download reviewed assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atomgit-release-${{ inputs.version }}
          path: dist
      - name: Check existing tag and release state
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}"; then
            echo "annotated tag exists; the publish job will verify its exact source SHA and resume the draft Release"
          fi
      - name: Create annotated immutable tag
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git fetch origin "${SOURCE_SHA}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          existing_commit=$(git ls-remote origin "refs/tags/${{ inputs.version }}^{}" | awk '{print $1}')
          if [ -n "$existing_commit" ]; then
            test "$existing_commit" = "${SOURCE_SHA}"
          else
            git tag -a "${{ inputs.version }}" "${SOURCE_SHA}" -m "AtomGit CLI ${{ inputs.version }}"
            git push origin "${{ inputs.version }}"
          fi
      - name: Create or resume draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ inputs.version }}" >/dev/null 2>&1; then
            release_state=$(gh release view "${{ inputs.version }}" --json isDraft,isPrerelease,tagName --jq '[.isDraft, .isPrerelease, .tagName] | @tsv')
            expected_state=$(printf 'true\tfalse\t%s' "${{ inputs.version }}")
            test "$release_state" = "$expected_state" || { echo "existing Release is not the expected unpublished draft"; exit 1; }
          else
            gh release create "${{ inputs.version }}" --draft --title "AtomGit CLI ${{ inputs.version }}" --notes-file RELEASE_NOTES.md
          fi
          gh release edit "${{ inputs.version }}" --notes-file RELEASE_NOTES.md
          expected=$(printf '%s\n' LICENSE SHA256SUMS "atomgit-${{ inputs.version }}-py3-none-any.whl" "atomgit-${{ inputs.version }}.tar.gz" | sort)
          existing=$(gh release view "${{ inputs.version }}" --json assets --jq '.assets[].name' || true)
          unexpected=$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$existing" | sort))
          test -z "$unexpected" || { echo "draft Release contains unexpected assets"; exit 1; }
          if [ "$(printf '%s\n' "$existing" | sort)" = "$expected" ]; then
            mkdir remote-dist
            gh release download "${{ inputs.version }}" --dir remote-dist
            for asset in remote-dist/*; do
              name=$(basename "$asset")
              local_digest=$(sha256sum "$asset" | awk '{print $1}')
              remote_digest=$(gh release view "${{ inputs.version }}" --json assets --jq ".assets[] | select(.name == \"$name\") | .digest" | sed 's/^sha256://')
              test -n "$remote_digest" && test "$remote_digest" = "$local_digest" || { echo "downloaded draft asset differs from its recorded digest: $name"; exit 1; }
            done
            (cd remote-dist && sha256sum --strict -c SHA256SUMS)
            cmp LICENSE remote-dist/LICENSE
            python - "remote-dist/SHA256SUMS" "remote-dist/atomgit-${{ inputs.version }}-py3-none-any.whl" "remote-dist/atomgit-${{ inputs.version }}.tar.gz" "${{ inputs.version }}" <<'PY'
          import re
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          checksum_path = Path(sys.argv[1])
          wheel_path = Path(sys.argv[2])
          sdist_path = Path(sys.argv[3])
          version = sys.argv[4]
          expected_names = {"LICENSE", f"atomgit-{version}-py3-none-any.whl", f"atomgit-{version}.tar.gz"}
          entries = checksum_path.read_text(encoding="utf-8").splitlines()
          names = []
          for entry in entries:
              match = re.fullmatch(r"[0-9a-f]{64}  ([^/]+)", entry)
              assert match, f"invalid checksum entry: {entry!r}"
              names.append(match.group(1))
          assert set(names) == expected_names and len(names) == len(expected_names)
          with zipfile.ZipFile(wheel_path) as archive:
              metadata = next(name for name in archive.namelist() if name.endswith(".dist-info/METADATA"))
              text = archive.read(metadata).decode("utf-8")
          assert "Name: atomgit\n" in text
          assert f"Version: {version}\n" in text
          assert "Classifier: Development Status :: 5 - Production/Stable\n" in text
          with tarfile.open(sdist_path, "r:gz") as archive:
              expected_metadata = f"atomgit-{version}/PKG-INFO"
              members = [member for member in archive.getmembers() if member.name == expected_metadata]
              assert len(members) == 1
              package_info = archive.extractfile(members[0])
              assert package_info is not None
              text = package_info.read().decode("utf-8")
          assert "Name: atomgit\n" in text
          assert f"Version: {version}\n" in text
          assert "Classifier: Development Status :: 5 - Production/Stable\n" in text
          PY
            echo "ASSET_DIR=remote-dist" >> "$GITHUB_ENV"
            echo "complete draft verified; preserving and publishing its original assets"
            exit 0
          fi
          for asset in dist/*; do
            name=$(basename "$asset")
            if printf '%s\n' "$existing" | grep -Fxq "$name"; then
              local_digest=$(sha256sum "$asset" | awk '{print $1}')
              remote_digest=$(gh release view "${{ inputs.version }}" --json assets --jq ".assets[] | select(.name == \"$name\") | .digest" | sed 's/^sha256://')
              test -n "$remote_digest" && test "$remote_digest" = "$local_digest" || { echo "existing asset bytes differ: $name"; exit 1; }
              echo "asset already exists with identical bytes; keeping $name"
              continue
            fi
            gh release upload "${{ inputs.version }}" "$asset"
          done
          echo "ASSET_DIR=dist" >> "$GITHUB_ENV"
      - name: Verify exact assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_state=$(gh release view "${{ inputs.version }}" --json isDraft,isPrerelease,tagName --jq '[.isDraft, .isPrerelease, .tagName] | @tsv')
          expected_state=$(printf 'true\tfalse\t%s' "${{ inputs.version }}")
          test "$release_state" = "$expected_state" || { echo "Release state changed before publication"; exit 1; }
          expected_assets=$(printf '%s\n' LICENSE SHA256SUMS "atomgit-${{ inputs.version }}-py3-none-any.whl" "atomgit-${{ inputs.version }}.tar.gz" | sort)
          actual_assets=$(gh release view "${{ inputs.version }}" --json assets --jq '.assets[].name' | sort)
          test "$actual_assets" = "$expected_assets" || { echo "remote Release asset set differs from the exact expected set"; exit 1; }
          for asset in "$ASSET_DIR"/*; do
            name=$(basename "$asset")
            local_digest=$(sha256sum "$asset" | awk '{print $1}')
            remote_digest=$(gh release view "${{ inputs.version }}" --json assets --jq ".assets[] | select(.name == \"$name\") | .digest" | sed 's/^sha256://')
            test -n "$remote_digest" && test "$remote_digest" = "$local_digest" || { echo "remote asset bytes differ after upload: $name"; exit 1; }
          done
          gh release edit "${{ inputs.version }}" --draft=false
